name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  SPARKLE_VERSION: 2.9.4

jobs:
  build:
    name: Build, sign, and notarize
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)

          echo -n "$CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

          echo "CODESIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"

      - name: Set up Sparkle signing
        env:
          SPARKLE_ED25519_PUBLIC_KEY: ${{ secrets.SPARKLE_ED25519_PUBLIC_KEY }}
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          curl -fL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -o "$RUNNER_TEMP/sparkle.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          xattr -dr com.apple.quarantine "$RUNNER_TEMP/sparkle" || true

          KEY_FILE="$RUNNER_TEMP/sparkle_ed25519.key"
          printf '%s' "$SPARKLE_ED25519_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          /usr/libexec/PlistBuddy -c "Set :SUPublicEDKey $SPARKLE_ED25519_PUBLIC_KEY" Mist/Info.plist

          echo "SPARKLE_BIN=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"
          echo "SPARKLE_PRIVATE_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Build app
        # Signing is disabled here: the runner has no Xcode account, so
        # automatic signing cannot fetch provisioning profiles. package-app.sh
        # signs everything with the Developer ID certificate afterwards.
        run: |
          xcodebuild clean build \
            -project Mist.xcodeproj \
            -scheme Mist \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Sign, notarize, and package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          .github/scripts/package-app.sh \
            "build/Build/Products/Release/Mist.app" \
            "Mist.zip" \
            "Mist.dmg"

      - name: Upload Sparkle metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: sparkle-metadata
          path: Mist.zip.sparkle.json
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            Mist.dmg
            Mist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/sparkle_ed25519.key"

  appcast:
    name: Update Sparkle appcast
    needs: build
    runs-on: ubuntu-latest
    # Skip prerelease tags (e.g. v1.1.0-beta.1) so they never reach the feed.
    if: ${{ !contains(github.ref_name, '-') }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download Sparkle metadata
        uses: actions/download-artifact@v4
        with:
          name: sparkle-metadata
          path: dist

      - name: Update appcast on main
        run: |
          set -euo pipefail
          python3 .github/scripts/update-appcast.py \
            --tag "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dist dist

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          if git diff --cached --quiet; then
            echo "No appcast changes to commit"
            exit 0
          fi
          git commit -m "chore(release): update appcast for ${GITHUB_REF_NAME}"
          git pull --rebase origin main
          git push origin HEAD:main
